<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador y Copiador</title>
    <style>
        /* Diseño moderno y minimalista */
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
            padding: 2rem 1rem;
            box-sizing: border-box;
            gap: 2rem;
        }
        .contenedor-app {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            align-items: center;
            max-width: 750px;
            width: 100%;
        }
        .tarjeta {
            background: white;
            padding: 2.2rem 2.8rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
            display: flex;
            align-items: center;
            gap: 3rem;
            width: 100%;
            box-sizing: border-box;
        }
        .tarjeta-email {
            flex-direction: column;
            gap: 1.2rem;
            align-items: stretch;
            padding: 2rem 2.8rem;
        }
        
        /* Sección de número de registro (muy a la izquierda) */
        .seccion-registro {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 120px;
            padding: 1.2rem 1.4rem;
            background-color: #f8fafc;
            border: 2px dashed #cbd5e1;
            border-radius: 16px;
            user-select: none;
        }
        .etiqueta-registro {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #64748b;
            margin-bottom: 0.5rem;
        }
        .numero-registro {
            font-size: 2.6rem;
            font-weight: 800;
            color: #3b82f6;
            line-height: 1;
        }

        /* Divisor visual sutil */
        .divisor {
            width: 1px;
            height: 130px;
            background-color: #e2e8f0;
        }

        /* Sección principal de copiado */
        .seccion-copiado {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
        }
        input[type="text"] {
            font-size: 1.9rem;
            text-align: center;
            padding: 0.85rem 1.2rem;
            width: 100%;
            box-sizing: border-box;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            background-color: #f8fafc;
            color: #1e293b;
            font-weight: 800;
            margin-bottom: 1.3rem;
            outline: none;
            letter-spacing: 0.5px;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: #3b82f6;
        }
        .pantalla-email {
            font-size: 1.45rem !important;
            color: #0f172a !important;
            letter-spacing: 0.2px !important;
            margin-bottom: 0 !important;
            background-color: #f1f5f9 !important;
        }
        .botones {
            display: flex;
            gap: 0.6rem;
            justify-content: center;
            width: 100%;
            align-items: center;
        }
        button {
            font-size: 1.1rem;
            padding: 0.75rem 1.2rem;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            transition: all 0.2s;
            user-select: none;
        }
        button:active {
            transform: scale(0.95);
        }
        .btn-salto {
            background-color: #e2e8f0;
            color: #475569;
            font-size: 0.95rem;
            padding: 0.75rem 0.9rem;
            font-weight: 700;
        }
        .btn-salto:hover {
            background-color: #cbd5e1;
            color: #1e293b;
        }
        #btnMenos {
            background-color: #64748b;
            color: white;
            font-size: 1.3rem;
            padding: 0.6rem 1rem;
        }
        #btnMenos:hover { background-color: #475569; }

        #btnMas {
            background-color: #3b82f6;
            color: white;
            font-size: 1.3rem;
            padding: 0.6rem 1.1rem;
        }
        #btnMas:hover { background-color: #2563eb; }
        
        #btnCopiar {
            background-color: #10b981;
            color: white;
            flex-grow: 1;
            padding: 0.75rem 1.5rem;
            font-size: 1.15rem;
        }
        #btnCopiar:hover { background-color: #059669; }

        /* Estilos tarjeta de email */
        .titulo-seccion {
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #64748b;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .contenedor-email-input {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        .btn-generar {
            background-color: #8b5cf6;
            color: white;
        }
        .btn-generar:hover {
            background-color: #7c3aed;
        }
        .btn-copiar-email {
            background-color: #06b6d4;
            color: white;
            flex-grow: 1;
        }
        .btn-copiar-email:hover {
            background-color: #0891b2;
        }
        
        /* Notificación flotante de "Copiado" */
        .toast {
            position: fixed;
            bottom: 30px;
            background: #1e293b;
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 500;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            pointer-events: none;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.2);
            z-index: 100;
        }
        .toast.mostrar {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>

        // Estado inicial: inicia en el registro 4
        let registroActual = 4;

        const numRegistro = document.getElementById('numRegistro');
        const pantalla = document.getElementById('pantalla');
        const btnMenos10 = document.getElementById('btnMenos10');
        const btnMenos = document.getElementById('btnMenos');
        const btnMas = document.getElementById('btnMas');
        const btnMas10 = document.getElementById('btnMas10');
        const btnCopiar = document.getElementById('btnCopiar');

        const pantallaEmail = document.getElementById('pantallaEmail');
        const btnGenerarEmail = document.getElementById('btnGenerarEmail');
        const btnCopiarEmail = document.getElementById('btnCopiarEmail');
        const toast = document.getElementById('toast');

        // Mostrar mensaje toast
        function mostrarToast(mensaje) {
            toast.textContent = mensaje || '¡Copiado al portapapeles! 📋';
            toast.classList.add('mostrar');
            setTimeout(() => {
                toast.classList.remove('mostrar');
            }, 2000);
        }

        // --- SECCIÓN 1: LÓGICA DE REGISTROS ---
        function obtenerTexto(registro) {
            if (registro < 117) {
                return 'y' + String(registro).padStart(3, '0');
            } else {
                const index = registro - 117;
                if (index < nombresUsuarios.length) {
                    return nombresUsuarios[index];
                } else {
                    return 'user' + registro + 'x' + (registro * 7 % 999);
                }
            }
        }

        function actualizarVista() {
            numRegistro.textContent = registroActual;
            pantalla.value = obtenerTexto(registroActual);
        }

        actualizarVista();

        btnMas.addEventListener('click', () => {
            registroActual++;
            actualizarVista();
        });

        btnMenos.addEventListener('click', () => {
            if (registroActual > 1) {
                registroActual--;
                actualizarVista();
            }
        });

        btnMas10.addEventListener('click', () => {
            registroActual += 10;
            actualizarVista();
        });

        btnMenos10.addEventListener('click', () => {
            registroActual = Math.max(1, registroActual - 10);
            actualizarVista();
        });

        btnCopiar.addEventListener('click', () => {
            navigator.clipboard.writeText(pantalla.value).then(() => {
                mostrarToast('¡Usuario copiado al portapapeles! 📋');
            });
        });

        // --- SECCIÓN 2: GENERADOR DE EMAILS 100% ÚNICOS Y ALEATORIOS ---
        function obtenerHistorialEmails() {
            try {
                const hist = localStorage.getItem('historial_emails_unicos');
                return hist ? JSON.parse(hist) : [];
            } catch (e) {
                return [];
            }
        }

        function guardarEnHistorial(email) {
            try {
                const hist = obtenerHistorialEmails();
                hist.push(email);
                localStorage.setItem('historial_emails_unicos', JSON.stringify(hist));
            } catch (e) {}
        }

        function generarCadenaAleatoria() {
            const caracteres = 'abcdefghijklmnopqrstuvwxyz0123456789';
            let resultado = '';
            
            // 1. Bytes aleatorios criptográficos
            const arrayAleatorio = new Uint8Array(10);
            window.crypto.getRandomValues(arrayAleatorio);
            
            for (let i = 0; i < arrayAleatorio.length; i++) {
                resultado += caracteres[arrayAleatorio[i] % caracteres.length];
            }
            
            // 2. Timestamp en base36 (milisegundos exactos)
            const tiempoBase36 = (Date.now() + Math.floor(performance.now() * 100)).toString(36);
            
            return resultado + tiempoBase36;
        }

        function generarNuevoEmailUnico() {
            const historial = obtenerHistorialEmails();
            let nuevoEmail = '';
            let intentos = 0;
            
            do {
                const prefijo = generarCadenaAleatoria();
                nuevoEmail = prefijo + '@gmail.com';
                intentos++;
            } while (historial.includes(nuevoEmail) && intentos < 100);

            guardarEnHistorial(nuevoEmail);
            pantallaEmail.value = nuevoEmail;
        }

        // Generar el primer email al cargar
        generarNuevoEmailUnico();

        // Botón generar email
        btnGenerarEmail.addEventListener('click', () => {
            generarNuevoEmailUnico();
        });

        // Botón copiar email
        btnCopiarEmail.addEventListener('click', () => {
            navigator.clipboard.writeText(pantallaEmail.value).then(() => {
                mostrarToast('¡Email copiado al portapapeles! 📧');
            });
        });

        // Atajos de teclado generales
        document.addEventListener('keydown', (e) => {
            if (e.key === 'PageDown' || (e.shiftKey && e.key === 'ArrowRight')) {
                registroActual += 10;
                actualizarVista();
            } else if (e.key === 'PageUp' || (e.shiftKey && e.key === 'ArrowLeft')) {
                registroActual = Math.max(1, registroActual - 10);
                actualizarVista();
            } else if (e.key === 'ArrowRight' || e.key === '+') {
                registroActual++;
                actualizarVista();
            } else if (e.key === 'ArrowLeft' || e.key === '-') {
                if (registroActual > 1) {
                    registroActual--;
                    actualizarVista();
                }
            }
        });
    </script>
